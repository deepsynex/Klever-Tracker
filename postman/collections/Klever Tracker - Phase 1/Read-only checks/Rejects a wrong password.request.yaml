$kind: http-request
description: 'A failed login: changes nothing (unknown email).'
method: POST
url: '{{graphqlUrl}}'
order: 3000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "mutation Login($email: String!, $password: String!) { login(email: $email, password: $password) { token } }",
      "variables": {
        "email": "nobody-{{$timestamp}}@example.invalid",
        "password": "not-the-password"
      }
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Wrong password and unknown email must give the same answer (no account discovery).
      const body = pm.response.json();
      pm.test("Invalid credentials", () => pm.expect(body.errors?.[0]?.message).to.eql("Invalid credentials."));
      pm.test("No token issued", () => pm.expect(body.data?.login ?? null).to.be.null);
