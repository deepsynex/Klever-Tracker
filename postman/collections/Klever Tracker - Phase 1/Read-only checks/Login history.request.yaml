$kind: http-request
method: POST
url: '{{graphqlUrl}}'
order: 8000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "query UserLoginLogs($first: Int!, $page: Int) { userLoginLogs(first: $first, page: $page) { data { id userId loggedInAt ipAddress userAgent } paginatorInfo { total currentPage lastPage } } }",
      "variables": {
        "first": 50,
        "page": 1
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("No GraphQL errors", () => pm.expect(body.errors, JSON.stringify(body.errors)).to.be.undefined);

      const page = body.data.userLoginLogs;
      pm.test("Paged with totals", () => {
        pm.expect(page.paginatorInfo.total).to.be.a("number");
        pm.expect(page.paginatorInfo.currentPage).to.eql(1);
      });
      pm.test("Entries name a user", () => page.data.forEach((l) => pm.expect(l.userId).to.be.a("string")));
