$kind: http-request
method: POST
url: '{{graphqlUrl}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "mutation ChangePassword($oldPassword: String!, $newPassword: String!) { changePassword(oldPassword: $oldPassword, newPassword: $newPassword) }",
      "variables": {
        "oldPassword": "{{password}}",
        "newPassword": "{{newPassword}}"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("No GraphQL errors", () => pm.expect(body.errors, JSON.stringify(body.errors)).to.be.undefined);

      pm.test("Changed", () => pm.expect(body.data.changePassword).to.eql(true));
