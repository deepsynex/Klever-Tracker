$kind: http-request
method: POST
url: '{{graphqlUrl}}'
order: 9000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "mutation GrantUserVehicleAccess($userId: ID!, $vehicleId: ID!) { grantUserVehicleAccess(userId: $userId, vehicleId: $vehicleId) { id } }",
      "variables": {
        "userId": "{{userId}}",
        "vehicleId": "{{vehicleId}}"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("No GraphQL errors", () => pm.expect(body.errors, JSON.stringify(body.errors)).to.be.undefined);

      pm.environment.set("vehicleGrantId", body.data.grantUserVehicleAccess.id);
