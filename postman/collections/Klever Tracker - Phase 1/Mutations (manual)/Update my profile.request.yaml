$kind: http-request
method: POST
url: '{{graphqlUrl}}'
order: 5000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "mutation UpdateMyProfile($id: ID!, $name: String, $mobile: String, $address: String) { updateUser(id: $id, name: $name, mobile: $mobile, address: $address) { id } }",
      "variables": {
        "id": "{{meId}}",
        "name": "{{profileName}}",
        "mobile": null,
        "address": null
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("No GraphQL errors", () => pm.expect(body.errors, JSON.stringify(body.errors)).to.be.undefined);
