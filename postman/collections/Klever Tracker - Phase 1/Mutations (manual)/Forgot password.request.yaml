$kind: http-request
description: 'Sends a reset email when the address is registered.'
method: POST
url: '{{graphqlUrl}}'
order: 2000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "mutation ForgotPassword($email: String!) { forgotPassword(email: $email) }",
      "variables": {
        "email": "{{email}}"
      }
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("Always true (no account discovery)", () => pm.expect(body.data.forgotPassword).to.eql(true));
