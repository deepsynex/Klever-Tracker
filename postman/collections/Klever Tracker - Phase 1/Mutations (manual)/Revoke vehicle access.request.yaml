$kind: http-request
method: POST
url: '{{graphqlUrl}}'
order: 10000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "mutation RevokeUserVehicleAccess($id: ID!) { revokeUserVehicleAccess(id: $id) { id } }",
      "variables": {
        "id": "{{vehicleGrantId}}"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("No GraphQL errors", () => pm.expect(body.errors, JSON.stringify(body.errors)).to.be.undefined);
