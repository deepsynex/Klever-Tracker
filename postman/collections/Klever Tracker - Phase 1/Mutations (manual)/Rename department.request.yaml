$kind: http-request
method: POST
url: '{{graphqlUrl}}'
order: 7000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "mutation UpdateDepartment($id: ID!, $name: String) { updateDepartment(id: $id, name: $name) { id } }",
      "variables": {
        "id": "{{departmentId}}",
        "name": "Postman test renamed {{$timestamp}}"
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("No GraphQL errors", () => pm.expect(body.errors, JSON.stringify(body.errors)).to.be.undefined);
