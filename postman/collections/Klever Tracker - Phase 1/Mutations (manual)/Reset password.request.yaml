$kind: http-request
method: POST
url: '{{graphqlUrl}}'
order: 3000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "query": "mutation ResetPassword($token: String!, $email: String!, $password: String!) { resetPassword(token: $token, email: $email, password: $password) }",
      "variables": {
        "token": "{{resetToken}}",
        "email": "{{email}}",
        "password": "{{newPassword}}"
      }
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      pm.test("No GraphQL errors", () => pm.expect(body.errors, JSON.stringify(body.errors)).to.be.undefined);
