    createModule(name: String!, code: String!): Module! @create @guard(with: ["sanctum"])
    updateModule(id: ID!, name: String, code: String): Module! @update @guard(with: ["sanctum"])
    "Permanently delete a module. Cascades to its role permissions."
    deleteModule(id: ID! @eq): Module! @delete @guard(with: ["sanctum"])
}

"One role's view/add/edit/delete permissions on one Module. Only read through Role in future — no standalone Role type exists yet, so this is reached by id directly."
type RolePermission {
    id: ID!
    roleId: ID! @rename(attribute: "role_id")
    moduleId: ID! @rename(attribute: "module_id")
    canView: Boolean! @rename(attribute: "can_view")
    canAdd: Boolean! @rename(attribute: "can_add")
    canEdit: Boolean! @rename(attribute: "can_edit")
    canDelete: Boolean! @rename(attribute: "can_delete")
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    rolePermissions: [RolePermission!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "admin", action: "view")
    rolePermission(id: ID! @eq): RolePermission @find @guard(with: ["sanctum"]) @requiresPermission(module: "admin", action: "view")
}

extend type Mutation {
    """
    Resolved by App\\GraphQL\\Mutations\\CreateRolePermission (not the generic @create
    directive) — it also blocks a caller from setting their own role's canView/canEdit
    on the "core" module (Company/Role/User/Device) to false, which would lock them
    out of fixing it themselves. See RoleSelfLockoutGuard.
    """
    createRolePermission(
        roleId: ID! @rename(attribute: "role_id") @authorizeParent(model: "App\\Models\\Role")
        moduleId: ID! @rename(attribute: "module_id")
        canView: Boolean @rename(attribute: "can_view")
        canAdd: Boolean @rename(attribute: "can_add")
        canEdit: Boolean @rename(attribute: "can_edit")
        canDelete: Boolean @rename(attribute: "can_delete")
    ): RolePermission! @field(resolver: "App\\GraphQL\\Mutations\\CreateRolePermission") @guard(with: ["sanctum"]) @requiresPermission(module: "admin", action: "add")

    "Resolved by App\\GraphQL\\Mutations\\UpdateRolePermission, for the same self-lockout reason as createRolePermission."
    updateRolePermission(
        id: ID!
        canView: Boolean @rename(attribute: "can_view")
        canAdd: Boolean @rename(attribute: "can_add")
        canEdit: Boolean @rename(attribute: "can_edit")
        canDelete: Boolean @rename(attribute: "can_delete")
    ): RolePermission! @field(resolver: "App\\GraphQL\\Mutations\\UpdateRolePermission") @guard(with: ["sanctum"]) @requiresPermission(module: "admin", action: "edit")

    deleteRolePermission(id: ID! @eq @authorizeParent(model: "App\\Models\\RolePermission")): RolePermission! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "admin", action: "delete")
}

