        createdBy: ID @rename(attribute: "created_by")
    ): AlertRule! @update @guard(with: ["sanctum"]) @requiresPermission(module: "alerts", action: "edit")

    "Permanently delete an alert rule. Cascades to its recipients and alert_events."
    deleteAlertRule(id: ID! @eq @authorizeParent(model: "App\\Models\\AlertRule")): AlertRule! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "alerts", action: "delete")
