# ---------------------------------------------------------------------------
# Vehicle: the full fleet record — identification, driver assignment, installation,
# tracking limits, odometer/service history, and purchase/finance detail. Previously
# only a deliberately minimal, read-only stand-in existed (added just to make
# VehicleGroup.vehicles resolvable) — this is the real thing, with full CRUD.
#
# Unlike every domain built after Driver, `vehicles` DOES have a deleted_at column
# (it already used SoftDeletes before any of this reference-domain work started) — so
# deleteVehicle, like deleteDriver, is a soft delete, not permanent.
#
# Driver references (primaryDriverId, attendant1Id, attendant2Id) are exposed as plain
# IDs, not relation objects, even though Driver has its own type — this matches the
# convention used everywhere else in this schema (e.g. AlertRule.eventTypeId): a
# reference to another record is an ID unless that other record's own children are
# being listed (as in VehicleGroup.vehicles), not just because a type happens to exist.
# ---------------------------------------------------------------------------

"""
A company's own dropdown of vehicle types (Truck, Car, JCB, Crane, ...). Vehicle.vehicleTypeId
is a restrict-on-delete FK — retire a type via `status` instead of deleting it once any
vehicle references it.
"""
type VehicleType {
    id: ID!
    companyId: ID! @rename(attribute: "company_id")
    name: String!
    "active | inactive"
    status: String!
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    vehicleTypes: [VehicleType!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "vehicles", action: "view")
    vehicleType(id: ID! @eq): VehicleType @find @guard(with: ["sanctum"]) @requiresPermission(module: "vehicles", action: "view")
}

extend type Mutation {
    createVehicleType(
        companyId: ID! @rename(attribute: "company_id") @forceOwnCompany
        name: String! @rules(apply: ["App\\Rules\\UniqueVehicleTypeName"])
        status: String
    ): VehicleType! @create @guard(with: ["sanctum"]) @requiresPermission(module: "vehicles", action: "add")

    updateVehicleType(id: ID!, name: String @rules(apply: ["App\\Rules\\UniqueVehicleTypeName"]), status: String): VehicleType! @update @guard(with: ["sanctum"]) @requiresPermission(module: "vehicles", action: "edit")

    "Permanently delete a vehicle type. Will fail if any vehicles still reference it (restrict-on-delete FK) — set status to \"inactive\" instead to retire it."
    deleteVehicleType(id: ID! @eq @authorizeParent(model: "App\\Models\\VehicleType")): VehicleType! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "vehicles", action: "delete")
}

"""
A fleet vehicle. workingDays is an opaque JSON-encoded string (this project's usual
convention for jsonb columns — see Route.daysOfWeek, AlertRule.parameters). Every
date/time field (installDate, trackingHoursFrom, lastServiceDate, etc.) is a plain
string — this schema has no date/time scalar.
"""
type Vehicle {
    id: ID!
    companyId: ID! @rename(attribute: "company_id")

    "--- Identification ---"
    vehicleName: String @rename(attribute: "vehicle_name")
    plateNo: String! @rename(attribute: "plate_no")
    registrationNo: String @rename(attribute: "registration_no")
    brand: String
    manufacturer: String
    model: String
    year: Int
    colour: String
    vehicleTypeId: ID! @rename(attribute: "vehicle_type_id")
    seats: Float
    loadCapacityKg: Float @rename(attribute: "load_capacity_kg")
    chassisNo: String @rename(attribute: "chassis_no")
    barcode: String
    mapIcon: String @rename(attribute: "map_icon")
    photoPath: String @rename(attribute: "photo_path")
    "owned | leased | rented"
    ownership: String
    comment: String

    "--- Driver assignment (plain IDs — see note above) ---"
    primaryDriverId: ID @rename(attribute: "primary_driver_id")
    attendant1Id: ID @rename(attribute: "attendant_1_id")
    attendant2Id: ID @rename(attribute: "attendant_2_id")
    contactMobile: String @rename(attribute: "contact_mobile")

    "--- Installation ---"
    installDate: String! @rename(attribute: "install_date")
    installerName: String @rename(attribute: "installer_name")
    installLocationInVehicle: String @rename(attribute: "install_location_in_vehicle")
    paymentType: String! @rename(attribute: "payment_type")
    subscriptionExpiresAt: String @rename(attribute: "subscription_expires_at")
    renewedAt: String @rename(attribute: "renewed_at")
    timezone: String

    "--- Tracking limits & schedule ---"
    hasCanBus: Boolean! @rename(attribute: "has_can_bus")
    speedLimitKmh: Int! @rename(attribute: "speed_limit_kmh")
    idleLimitMinutes: Int! @rename(attribute: "idle_limit_minutes")
    trackingHoursFrom: String @rename(attribute: "tracking_hours_from")
    trackingHoursTo: String @rename(attribute: "tracking_hours_to")
    "Opaque JSON-encoded string — this API does not parse or validate it."
    workingDays: String @rename(attribute: "working_days")

    "--- Odometer & service history ---"
    odometerKm: Float! @rename(attribute: "odometer_km")
    odometerCorrectionKm: Float! @rename(attribute: "odometer_correction_km")
    lastServiceDate: String @rename(attribute: "last_service_date")
    lastOilChangeDate: String @rename(attribute: "last_oil_change_date")
    lastTyreChangeDate: String @rename(attribute: "last_tyre_change_date")
    serviceIntervalKm: Int @rename(attribute: "service_interval_km")
    oilIntervalKm: Int @rename(attribute: "oil_interval_km")
    tyreIntervalKm: Int @rename(attribute: "tyre_interval_km")
    machineServiceHours: Float @rename(attribute: "machine_service_hours")

    "--- Purchase & finance ---"
    purchaseDate: String @rename(attribute: "purchase_date")
    totalCost: Float @rename(attribute: "total_cost")
    downPayment: Float @rename(attribute: "down_payment")
    monthlyEmi: Float @rename(attribute: "monthly_emi")
    emiCount: Int @rename(attribute: "emi_count")
    emiDueDay: Int @rename(attribute: "emi_due_day")
    fuelType: String @rename(attribute: "fuel_type")
    fuelConsumptionRate: Float @rename(attribute: "fuel_consumption_rate")

    "Users granted direct visibility into this vehicle (independent of any group)."
    userAccess: [UserVehicle!]! @hasMany

    "This vehicle's device's current/last-known position, if it has ever reported one."
    lastPosition: DeviceLastPosition @hasOne

    "active | inactive"
    status: String!
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

