"""
An app user. password and twoFactorSecret are deliberately absent from this type
entirely — password is write-only (hashed automatically on write by the model's own
cast, same as Laravel's standard convention) and never readable; twoFactorSecret has no
read or write path at all yet, since there's no 2FA enrollment flow in this codebase to
generate/validate it safely — exposing a raw settable secret without that flow would be
more dangerous than useful. notificationPreferences is an opaque JSON-encoded string,
same convention as elsewhere.
"""
type User {
    id: ID!
    companyId: ID @rename(attribute: "company_id")
    roleId: ID! @rename(attribute: "role_id")
    departmentId: ID @rename(attribute: "department_id")
    name: String!
    username: String!
    email: String!
    mobile: String
    address: String
    photoPath: String @rename(attribute: "photo_path")
    "active | inactive"
    status: String!
    isAdmin: Boolean! @rename(attribute: "is_admin")
    isSuperAdmin: Boolean! @rename(attribute: "is_super_admin")
    defaultLandingPage: String @rename(attribute: "default_landing_page")
    muteAlerts: Boolean! @rename(attribute: "mute_alerts")
    "Opaque JSON-encoded string — this API does not parse or validate it."
    notificationPreferences: String @rename(attribute: "notification_preferences")
    twoFactorEnabled: Boolean! @rename(attribute: "two_factor_enabled")
    lastLoginAt: String @rename(attribute: "last_login_at")
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    users: [User!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "core", action: "view")
    user(id: ID! @eq): User @find @guard(with: ["sanctum"]) @requiresPermission(module: "core", action: "view")
}

