# =============================================================================
# Company, Role, User, Device: the four core models used throughout the device
# pipeline since the very start of this project, which — until now — had never been
# given a GraphQL type of their own (every other domain only ever referenced them by
# plain ID). Cross-references between these four and everything else stay plain IDs,
# not nested objects, consistent with every other cross-reference in this schema
# (e.g. AlertRule.eventTypeId) — a type existing isn't itself a reason to nest it;
# that's reserved for a record's own child collections (Route.points, VehicleGroup.vehicles,
# etc.). Company's own ~20 HasMany relations (vehicles, devices, drivers, geofences, ...)
# are deliberately NOT exposed as fields on `type Company` here, for the same reason they
# were never exposed when each of those domains was built: they're reciprocal
# convenience relations for backend code, not a promise of GraphQL surface area. A
# client lists a company's vehicles via `vehicles`, not `company(id).vehicles`.
# =============================================================================

"""
A tenant company. location is a raw PostGIS geography Point column, exposed as
locationLat/locationLng (same pattern as Geofence/Poi). smtpPassword is write-only —
deliberately absent from this type's readable fields, since it's a real credential for
the company's own SMTP relay (not a one-way hash like ApiKey.keyHash), so exposing it
would be a genuine secret leak. Company can self-reference via parentCompanyId (for
reseller/sub-company hierarchies).
"""
type Company {
    id: ID!
    parentCompanyId: ID @rename(attribute: "parent_company_id")
    isReseller: Boolean! @rename(attribute: "is_reseller")
    "customer | distributor"
    accountType: String! @rename(attribute: "account_type")
    name: String!
    address: String
    city: String!
    state: String!
    country: String!
    timezone: String!
    website: String
    industry: String
    logoPath: String @rename(attribute: "logo_path")
    "active | suspended | trial"
    status: String!
    isTrial: Boolean! @rename(attribute: "is_trial")
    trialEndsAt: String @rename(attribute: "trial_ends_at")
    accountExpiresAt: String @rename(attribute: "account_expires_at")
    taxExpiresAt: String @rename(attribute: "tax_expires_at")
    maxUsers: Int @rename(attribute: "max_users")
    maxStaff: Int @rename(attribute: "max_staff")
    maxDrivers: Int @rename(attribute: "max_drivers")
    paymentMode: String @rename(attribute: "payment_mode")
    monthlyRental: Float @rename(attribute: "monthly_rental")
    deviceCharge: Float @rename(attribute: "device_charge")
    simCharge: Float @rename(attribute: "sim_charge")
    applicationCharge: Float @rename(attribute: "application_charge")
    totalCharge: Float @rename(attribute: "total_charge")
    "Uploaded via uploadFile(purpose: \"document\")."
    invoicePath: String @rename(attribute: "invoice_path")
    fatigueHours: Float @rename(attribute: "fatigue_hours")
    tripCloseRule: String @rename(attribute: "trip_close_rule")
    tripCloseOnBarcode: Boolean! @rename(attribute: "trip_close_on_barcode")
    offlineAlertMinutes: Int @rename(attribute: "offline_alert_minutes")
    offlineAlertsEnabled: Boolean! @rename(attribute: "offline_alerts_enabled")
    smtpHost: String @rename(attribute: "smtp_host")
    smtpPort: Int @rename(attribute: "smtp_port")
    smtpEncryption: String @rename(attribute: "smtp_encryption")
    smtpUsername: String @rename(attribute: "smtp_username")
    createdBy: ID @rename(attribute: "created_by")
    updatedBy: ID @rename(attribute: "updated_by")
    lastIp: String @rename(attribute: "last_ip")
    "Latitude of this company's registered location. Null if not set."
    locationLat: Float @method(name: "locationLat")
    "Longitude of this company's registered location. Null if not set."
    locationLng: Float @method(name: "locationLng")
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    companies: [Company!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "core", action: "view")
    company(id: ID! @eq): Company @find @guard(with: ["sanctum"]) @requiresPermission(module: "core", action: "view")
}

