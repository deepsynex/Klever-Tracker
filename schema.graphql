# ---------------------------------------------------------------------------
# Vehicle groups: VehicleGroup (a possibly hierarchical grouping of vehicles) ->
# VehicleGroupMember (one vehicle's membership in a group). No deleted_at column on
# either table — every delete below is permanent. Several already-built domains
# (AlertRule.vehicleGroupId, Route.vehicleGroupId) reference vehicle_groups by plain ID
# — they are not upgraded to a relation here, since that's a deliberate schema change,
# not something to bundle silently into adding this model.
# ---------------------------------------------------------------------------

"""
A (possibly hierarchical) grouping of vehicles within a company — e.g. "North Region"
containing sub-groups per depot. parentId references another VehicleGroup (nullable);
deleting a parent does not delete its children, it just clears their parentId.
"""
type VehicleGroup {
    id: ID!
    companyId: ID! @rename(attribute: "company_id")
    parentId: ID @rename(attribute: "parent_id")
    name: String!
    inchargeName: String @rename(attribute: "incharge_name")
    inchargeEmail: String @rename(attribute: "incharge_email")
    colour: String
    "Direct child groups of this group."
    children: [VehicleGroup!]! @hasMany
    "Membership rows for this group — use these ids with deleteVehicleGroupMember."
    members: [VehicleGroupMember!]! @hasMany
    "Convenience: the actual Vehicle records in this group (reads through the same membership table as `members`)."
    vehicles: [Vehicle!]! @belongsToMany
    "Users granted visibility into this group."
    userAccess: [UserVehicleGroup!]! @hasMany
    "Geofences this entire group is assigned to."
    geofenceMemberships: [GeofenceVehicleGroup!]! @hasMany
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    vehicleGroups: [VehicleGroup!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"])
    vehicleGroup(id: ID! @eq): VehicleGroup @find @guard(with: ["sanctum"]) @requiresPermission(module: "vehicle-groups", action: "view")
}

extend type Mutation {
    createVehicleGroup(
        companyId: ID! @rename(attribute: "company_id") @forceOwnCompany
        parentId: ID @rename(attribute: "parent_id")
        name: String! @rules(apply: ["App\\Rules\\UniqueVehicleGroupNameAtLevel"])
        inchargeName: String @rename(attribute: "incharge_name")
        inchargeEmail: String @rename(attribute: "incharge_email") @rules(apply: ["nullable", "email"])
        colour: String
    ): VehicleGroup! @create @guard(with: ["sanctum"]) @requiresPermission(module: "vehicle-groups", action: "add")

    "Update an existing vehicle group. Only pass the fields that should change."
    updateVehicleGroup(
        id: ID!
        parentId: ID @rename(attribute: "parent_id") @rules(apply: ["App\\Rules\\VehicleGroupParentNotOwnDescendant"])
        name: String @rules(apply: ["App\\Rules\\UniqueVehicleGroupNameAtLevel"])
        inchargeName: String @rename(attribute: "incharge_name")
        inchargeEmail: String @rename(attribute: "incharge_email") @rules(apply: ["nullable", "email"])
        colour: String
    ): VehicleGroup! @update @guard(with: ["sanctum"]) @requiresPermission(module: "vehicle-groups", action: "edit")

    "Permanently delete a vehicle group. Children have their parentId cleared (not deleted); memberships are cascaded."
    deleteVehicleGroup(id: ID! @eq @authorizeParent(model: "App\\Models\\VehicleGroup")): VehicleGroup! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "vehicle-groups", action: "delete")
}

"One vehicle's membership in a vehicle group. Only read through VehicleGroup.members — no standalone query, same reasoning as the other join-as-entity tables (AlertRuleRecipient, RouteRunPoint, MaintenanceItem)."
type VehicleGroupMember {
    id: ID!
    vehicleGroupId: ID! @rename(attribute: "vehicle_group_id")
    vehicleId: ID! @rename(attribute: "vehicle_id")
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Mutation {
    "Add a vehicle to a group."
    createVehicleGroupMember(
        vehicleGroupId: ID! @rename(attribute: "vehicle_group_id") @authorizeParent(model: "App\\Models\\VehicleGroup")
        vehicleId: ID! @rename(attribute: "vehicle_id")
    ): VehicleGroupMember! @create @guard(with: ["sanctum"]) @requiresPermission(module: "vehicle-groups", action: "add")

    "Remove a vehicle from a group."
    deleteVehicleGroupMember(id: ID! @eq @authorizeParent(model: "App\\Models\\VehicleGroupMember")): VehicleGroupMember! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "vehicle-groups", action: "delete")
}

# =============================================================================
# The remaining reference tables from the 57-table schema — six groups, matching
# API Doc.md section 7's categorisation. None of these tables has a deleted_at
# column, so every delete below is permanent. Pivot/log-type tables follow the
# same conventions established above: a join-as-entity table (its own id) gets
# create/delete only, read through its parent, no standalone query; a pure
# append-only log (AuditLog, UserLoginLog, DeviceChangeLog) gets create + read
# only — no update, no delete, since editing/removing an audit trail defeats its
# purpose.
# =============================================================================

# --- Fuel ---------------------------------------------------------------------

"A voltage-to-litres calibration curve for a fuel tank sensor."
type FuelCalibration {
    id: ID!
    companyId: ID! @rename(attribute: "company_id")
    name: String!
    tankCapacityLitres: Float @rename(attribute: "tank_capacity_litres")
    minVoltage: Float @rename(attribute: "min_voltage")
    maxVoltage: Float @rename(attribute: "max_voltage")
    "Calibration points on this curve."
    points: [FuelCalibrationPoint!]! @hasMany
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    fuelCalibrations: [FuelCalibration!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "fuel", action: "view")
    fuelCalibration(id: ID! @eq): FuelCalibration @find @guard(with: ["sanctum"]) @requiresPermission(module: "fuel", action: "view")
}

extend type Mutation {
    createFuelCalibration(
        companyId: ID! @rename(attribute: "company_id") @forceOwnCompany
        name: String!
        tankCapacityLitres: Float @rename(attribute: "tank_capacity_litres") @rules(apply: ["nullable", "numeric", "gt:0"])
        minVoltage: Float @rename(attribute: "min_voltage") @rules(apply: ["App\\Rules\\FuelCalibrationMinVoltageBelowMax"])
