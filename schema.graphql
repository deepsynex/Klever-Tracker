"One notification target on an alert rule — either an app user, a raw email address, or a raw phone number (recipientType says which)."
type AlertRuleRecipient {
    id: ID!
    alertRuleId: ID! @rename(attribute: "alert_rule_id")
    "user | email | phone"
    recipientType: String! @rename(attribute: "recipient_type")
    userId: ID @rename(attribute: "user_id")
    email: String
    phone: String
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Mutation {
    "Add a recipient to an alert rule."
    createAlertRuleRecipient(
        alertRuleId: ID! @rename(attribute: "alert_rule_id") @authorizeParent(model: "App\\Models\\AlertRule")
        recipientType: String! @rename(attribute: "recipient_type")
        userId: ID @rename(attribute: "user_id")
        email: String
        phone: String
    ): AlertRuleRecipient! @create @guard(with: ["sanctum"]) @requiresPermission(module: "alerts", action: "add")

    "Remove a recipient from an alert rule."
    deleteAlertRuleRecipient(id: ID! @eq @authorizeParent(model: "App\\Models\\AlertRuleRecipient")): AlertRuleRecipient! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "alerts", action: "delete")
}

"""
One occurrence of an alert rule firing. occurredAt/acknowledgedAt/resolvedAt are plain
strings (same convention as every other timestamp in this schema). There is no
automatic rule-evaluation engine yet — see the AlertEvent model docblock — so rows here
only exist if created directly through this API.
"""
type AlertEvent {
    id: ID!
    alertRuleId: ID! @rename(attribute: "alert_rule_id")
    eventTypeId: ID! @rename(attribute: "event_type_id")
    vehicleId: ID! @rename(attribute: "vehicle_id")
    occurredAt: String! @rename(attribute: "occurred_at")
    "Opaque JSON-encoded string — this API does not parse or validate it."
    parameters: String
    acknowledgedAt: String @rename(attribute: "acknowledged_at")
    acknowledgedBy: ID @rename(attribute: "acknowledged_by")
    resolvedAt: String @rename(attribute: "resolved_at")
    notes: String
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    alertEvents: [AlertEvent!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "alerts", action: "view")
    alertEvent(id: ID! @eq): AlertEvent @find @guard(with: ["sanctum"]) @requiresPermission(module: "alerts", action: "view")
}

extend type Mutation {
    createAlertEvent(
        alertRuleId: ID! @rename(attribute: "alert_rule_id") @authorizeParent(model: "App\\Models\\AlertRule")
        eventTypeId: ID! @rename(attribute: "event_type_id")
        vehicleId: ID! @rename(attribute: "vehicle_id")
        occurredAt: String! @rename(attribute: "occurred_at")
        parameters: String
        notes: String
    ): AlertEvent! @create @guard(with: ["sanctum"]) @requiresPermission(module: "alerts", action: "add")

    """
    Update an alert event. Pass acknowledgedAt + acknowledgedBy to acknowledge it, or
    resolvedAt to resolve it — this is a plain field update, not a state machine; the
    caller is responsible for passing sensible values (e.g. the current time).
    """
    updateAlertEvent(
        id: ID!
        acknowledgedAt: String @rename(attribute: "acknowledged_at")
        acknowledgedBy: ID @rename(attribute: "acknowledged_by")
        resolvedAt: String @rename(attribute: "resolved_at")
        notes: String
    ): AlertEvent! @update @guard(with: ["sanctum"]) @requiresPermission(module: "alerts", action: "edit")

    "Permanently delete an alert event."
    deleteAlertEvent(id: ID! @eq @authorizeParent(model: "App\\Models\\AlertEvent")): AlertEvent! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "alerts", action: "delete")
}

# ---------------------------------------------------------------------------
# Routes domain: Route (definition) -> RoutePoint (planned, ordered stops) ->
# RouteRun (one actual execution on a date) -> RouteRunPoint (actual arrival/departure
# at a stop during a run). None of these tables has a deleted_at column — every delete
# below is permanent.
# ---------------------------------------------------------------------------

"""
A recurring/scheduled route a company runs (e.g. a delivery route). daysOfWeek is an
opaque JSON-encoded string (same convention as the alerts domain's jsonb fields).
startTime is a plain "HH:MM:SS" string — a Postgres `time` column, no native time
scalar in this schema. vehicleGroupId has no backing type yet (VehicleGroup isn't
modelled) — plain ID, no relation.
"""
type Route {
    id: ID!
    companyId: ID! @rename(attribute: "company_id")
    name: String!
    description: String
    colour: String
    vehicleId: ID @rename(attribute: "vehicle_id")
    vehicleGroupId: ID @rename(attribute: "vehicle_group_id")
    startDate: String @rename(attribute: "start_date")
    startTime: String @rename(attribute: "start_time")
    "Opaque JSON-encoded string — this API does not parse or validate it."
    daysOfWeek: String @rename(attribute: "days_of_week")
    alertEmail: String @rename(attribute: "alert_email")
    "This route's stops, in order."
    points: [RoutePoint!]! @hasMany
    "This route's actual executions."
    runs: [RouteRun!]! @hasMany
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    routes: [Route!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "routes", action: "view")
    route(id: ID! @eq): Route @find @guard(with: ["sanctum"]) @requiresPermission(module: "routes", action: "view")
}

extend type Mutation {
    createRoute(
        companyId: ID! @rename(attribute: "company_id") @forceOwnCompany
        name: String!
        description: String
        colour: String
        vehicleId: ID @rename(attribute: "vehicle_id")
        vehicleGroupId: ID @rename(attribute: "vehicle_group_id")
        startDate: String @rename(attribute: "start_date")
        startTime: String @rename(attribute: "start_time")
        daysOfWeek: String @rename(attribute: "days_of_week")
        alertEmail: String @rename(attribute: "alert_email")
    ): Route! @create @guard(with: ["sanctum"]) @requiresPermission(module: "routes", action: "add")

    "Update an existing route. Only pass the fields that should change."
    updateRoute(
        id: ID!
        name: String
        description: String
        colour: String
        vehicleId: ID @rename(attribute: "vehicle_id")
        vehicleGroupId: ID @rename(attribute: "vehicle_group_id")
        startDate: String @rename(attribute: "start_date")
        startTime: String @rename(attribute: "start_time")
        daysOfWeek: String @rename(attribute: "days_of_week")
        alertEmail: String @rename(attribute: "alert_email")
    ): Route! @update @guard(with: ["sanctum"]) @requiresPermission(module: "routes", action: "edit")

    "Permanently delete a route. Cascades to its points and runs."
    deleteRoute(id: ID! @eq @authorizeParent(model: "App\\Models\\Route")): Route! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "routes", action: "delete")
}

"""
One stop on a route, in order (sequence). location is a raw PostGIS geography Point
column, exposed as plain locationLat/locationLng (same approach as Geofence's
centreLat/centreLng) since Eloquent has no native geography type.
"""
type RoutePoint {
    id: ID!
    routeId: ID! @rename(attribute: "route_id")
    sequence: Int!
    address: String
    zone: String
    plannedArrivalTime: String @rename(attribute: "planned_arrival_time")
    stopTimeMinutes: Int @rename(attribute: "stop_time_minutes")
    "Latitude of this stop. Null if no location has been set."
    locationLat: Float @method(name: "locationLat")
    "Longitude of this stop. Null if no location has been set."
    locationLng: Float @method(name: "locationLng")
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Mutation {
    "Create a route point (resolved by App\\GraphQL\\Mutations\\CreateRoutePoint — it can't be the generic @create directive, since that can't write a geography column)."
    createRoutePoint(
        routeId: ID! @authorizeParent(model: "App\\Models\\Route")
        sequence: Int!
        address: String
        zone: String
        plannedArrivalTime: String
        stopTimeMinutes: Int
        location: GeoPointInput
    ): RoutePoint! @guard(with: ["sanctum"]) @requiresPermission(module: "routes", action: "add")

    "Update a route point (resolved by App\\GraphQL\\Mutations\\UpdateRoutePoint, for the same reason as createRoutePoint)."
    updateRoutePoint(
        id: ID!
        sequence: Int
        address: String
        zone: String
        plannedArrivalTime: String
        stopTimeMinutes: Int
        location: GeoPointInput
    ): RoutePoint! @guard(with: ["sanctum"]) @requiresPermission(module: "routes", action: "edit")

    "Permanently delete a route point. Cascades to its route_run_points."
    deleteRoutePoint(id: ID! @eq @authorizeParent(model: "App\\Models\\RoutePoint")): RoutePoint! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "routes", action: "delete")
}

"One actual execution of a route on a given date. zonesCovered is an opaque JSON-encoded string, same convention as elsewhere in this schema."
type RouteRun {
    id: ID!
    routeId: ID! @rename(attribute: "route_id")
    runDate: String! @rename(attribute: "run_date")
    tripComplete: Boolean! @rename(attribute: "trip_complete")
    "Opaque JSON-encoded string — this API does not parse or validate it."
    zonesCovered: String @rename(attribute: "zones_covered")
    delayedStartMinutes: Int @rename(attribute: "delayed_start_minutes")
    "Actual arrival/departure records for this run, one per stop reached."
    runPoints: [RouteRunPoint!]! @hasMany
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    routeRuns: [RouteRun!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "routes", action: "view")
    routeRun(id: ID! @eq): RouteRun @find @guard(with: ["sanctum"]) @requiresPermission(module: "routes", action: "view")
}

extend type Mutation {
    createRouteRun(
        routeId: ID! @rename(attribute: "route_id") @authorizeParent(model: "App\\Models\\Route")
        runDate: String! @rename(attribute: "run_date")
        tripComplete: Boolean @rename(attribute: "trip_complete")
        zonesCovered: String @rename(attribute: "zones_covered")
        delayedStartMinutes: Int @rename(attribute: "delayed_start_minutes")
    ): RouteRun! @create @guard(with: ["sanctum"]) @requiresPermission(module: "routes", action: "add")

    updateRouteRun(
        id: ID!
        runDate: String @rename(attribute: "run_date")
        tripComplete: Boolean @rename(attribute: "trip_complete")
        zonesCovered: String @rename(attribute: "zones_covered")
        delayedStartMinutes: Int @rename(attribute: "delayed_start_minutes")
    ): RouteRun! @update @guard(with: ["sanctum"]) @requiresPermission(module: "routes", action: "edit")

    "Permanently delete a route run. Cascades to its route_run_points."
    deleteRouteRun(id: ID! @eq @authorizeParent(model: "App\\Models\\RouteRun")): RouteRun! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "routes", action: "delete")
}

"""
Actual arrival/departure at one route point during one run — the realised counterpart
to RoutePoint's planned schedule. Only ever read through Route.runs -> RouteRun.runPoints
or RoutePoint's own relation — no standalone top-level query, same reasoning as
AlertRuleRecipient (only meaningful in context of its parent run).
"""
type RouteRunPoint {
    id: ID!
    routeRunId: ID! @rename(attribute: "route_run_id")
    routePointId: ID! @rename(attribute: "route_point_id")
    actualEnterAt: String @rename(attribute: "actual_enter_at")
    actualExitAt: String @rename(attribute: "actual_exit_at")
    timeSpentMinutes: Int @rename(attribute: "time_spent_minutes")
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Mutation {
    "Record that a run reached a route point."
    createRouteRunPoint(
        routeRunId: ID! @rename(attribute: "route_run_id") @authorizeParent(model: "App\\Models\\RouteRun")
        routePointId: ID! @rename(attribute: "route_point_id") @authorizeParent(model: "App\\Models\\RoutePoint")
        actualEnterAt: String @rename(attribute: "actual_enter_at")
        actualExitAt: String @rename(attribute: "actual_exit_at")
        timeSpentMinutes: Int @rename(attribute: "time_spent_minutes")
    ): RouteRunPoint! @create @guard(with: ["sanctum"]) @requiresPermission(module: "routes", action: "add")

    "Update actual arrival/departure/time-spent for a route run point."
    updateRouteRunPoint(
        id: ID!
        actualEnterAt: String @rename(attribute: "actual_enter_at")
        actualExitAt: String @rename(attribute: "actual_exit_at")
        timeSpentMinutes: Int @rename(attribute: "time_spent_minutes")
    ): RouteRunPoint! @update @guard(with: ["sanctum"]) @requiresPermission(module: "routes", action: "edit")

    "Permanently delete a route run point record."
    deleteRouteRunPoint(id: ID! @eq @authorizeParent(model: "App\\Models\\RouteRunPoint")): RouteRunPoint! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "routes", action: "delete")
}

# ---------------------------------------------------------------------------
# Maintenance domain: MaintenanceType / ServiceType (per-company dropdown masters) ->
# MaintenanceRecord (a garage visit/service/repair) -> MaintenanceItem (one line item
# on its bill). Neither MaintenanceRecord nor MaintenanceItem has a deleted_at column —
# every delete below is permanent. No geometry, no jsonb — the simplest domain wired up
# so far.
# ---------------------------------------------------------------------------

"A company's own dropdown of maintenance types (General, Critical, Preventive, Tyre, Engine, Painting, ...)."
type MaintenanceType {
    id: ID!
    companyId: ID! @rename(attribute: "company_id")
    name: String!
    "active | inactive"
    status: String!
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    maintenanceTypes: [MaintenanceType!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "view")
    maintenanceType(id: ID! @eq): MaintenanceType @find @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "view")
}

extend type Mutation {
    createMaintenanceType(
        companyId: ID! @rename(attribute: "company_id") @forceOwnCompany
        name: String! @rules(apply: ["App\\Rules\\UniqueMaintenanceTypeName"])
        status: String
    ): MaintenanceType! @create @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "add")

    updateMaintenanceType(id: ID!, name: String @rules(apply: ["App\\Rules\\UniqueMaintenanceTypeName"]), status: String): MaintenanceType! @update @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "edit")

    "Permanently delete a maintenance type. Will fail if any maintenance records still reference it (restrict-on-delete FK) — set status to \"inactive\" instead to retire it."
    deleteMaintenanceType(id: ID! @eq @authorizeParent(model: "App\\Models\\MaintenanceType")): MaintenanceType! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "delete")
}

"A company's own dropdown of service types (Oil change, Battery Change, Car Wash, ...)."
type ServiceType {
    id: ID!
    companyId: ID! @rename(attribute: "company_id")
    name: String!
    "active | inactive"
    status: String!
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    serviceTypes: [ServiceType!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "view")
    serviceType(id: ID! @eq): ServiceType @find @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "view")
}

extend type Mutation {
    createServiceType(
        companyId: ID! @rename(attribute: "company_id") @forceOwnCompany
        name: String! @rules(apply: ["App\\Rules\\UniqueServiceTypeName"])
        status: String
    ): ServiceType! @create @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "add")

    updateServiceType(id: ID!, name: String @rules(apply: ["App\\Rules\\UniqueServiceTypeName"]), status: String): ServiceType! @update @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "edit")

    "Permanently delete a service type. Will fail if any maintenance records still reference it (restrict-on-delete FK) — set status to \"inactive\" instead to retire it."
    deleteServiceType(id: ID! @eq @authorizeParent(model: "App\\Models\\ServiceType")): ServiceType! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "delete")
}

"A vehicle maintenance/service record (a garage visit, repair, or scheduled service)."
type MaintenanceRecord {
    id: ID!
    companyId: ID! @rename(attribute: "company_id")
    vehicleId: ID! @rename(attribute: "vehicle_id")
    driverId: ID @rename(attribute: "driver_id")
    odometerKm: Float @rename(attribute: "odometer_km")
    maintenanceTypeId: ID @rename(attribute: "maintenance_type_id")
    serviceTypeId: ID @rename(attribute: "service_type_id")
    "Plain date string (YYYY-MM-DD) — no date scalar in this schema."
    serviceDate: String @rename(attribute: "service_date")
    garageName: String @rename(attribute: "garage_name")
    garageAddress: String @rename(attribute: "garage_address")
    billNumber: String @rename(attribute: "bill_number")
    extraWorkDone: String @rename(attribute: "extra_work_done")
    discountAmount: Float @rename(attribute: "discount_amount")
    discountPercent: Float @rename(attribute: "discount_percent")
    subtotal: Float
    total: Float
    "scheduled | in_progress | completed"
    status: String!
    "Line items on this record's bill."
    items: [MaintenanceItem!]! @hasMany
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    maintenanceRecords: [MaintenanceRecord!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "view")
    maintenanceRecord(id: ID! @eq): MaintenanceRecord @find @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "view")
}

extend type Mutation {
    createMaintenanceRecord(
        companyId: ID! @rename(attribute: "company_id") @forceOwnCompany
        vehicleId: ID! @rename(attribute: "vehicle_id")
        driverId: ID @rename(attribute: "driver_id")
        odometerKm: Float @rename(attribute: "odometer_km") @rules(apply: ["nullable", "numeric", "min:0"])
        maintenanceTypeId: ID @rename(attribute: "maintenance_type_id") @authorizeParent(model: "App\\Models\\MaintenanceType")
        serviceTypeId: ID @rename(attribute: "service_type_id") @authorizeParent(model: "App\\Models\\ServiceType")
        serviceDate: String @rename(attribute: "service_date")
        garageName: String @rename(attribute: "garage_name")
        garageAddress: String @rename(attribute: "garage_address")
        billNumber: String @rename(attribute: "bill_number")
        extraWorkDone: String @rename(attribute: "extra_work_done")
        discountAmount: Float @rename(attribute: "discount_amount") @rules(apply: ["nullable", "numeric", "min:0", "App\\Rules\\MaintenanceDiscountWithinSubtotal"])
        discountPercent: Float @rename(attribute: "discount_percent") @rules(apply: ["nullable", "numeric", "min:0", "max:100"])
        subtotal: Float @rules(apply: ["nullable", "numeric", "min:0"])
        total: Float @rules(apply: ["nullable", "numeric", "min:0"])
        status: String
    ): MaintenanceRecord! @create @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "add")

    "Update an existing maintenance record. Only pass the fields that should change."
    updateMaintenanceRecord(
        id: ID!
        driverId: ID @rename(attribute: "driver_id")
        odometerKm: Float @rename(attribute: "odometer_km") @rules(apply: ["nullable", "numeric", "min:0"])
        maintenanceTypeId: ID @rename(attribute: "maintenance_type_id") @authorizeParent(model: "App\\Models\\MaintenanceType")
        serviceTypeId: ID @rename(attribute: "service_type_id") @authorizeParent(model: "App\\Models\\ServiceType")
        serviceDate: String @rename(attribute: "service_date")
        garageName: String @rename(attribute: "garage_name")
        garageAddress: String @rename(attribute: "garage_address")
        billNumber: String @rename(attribute: "bill_number")
        extraWorkDone: String @rename(attribute: "extra_work_done")
        discountAmount: Float @rename(attribute: "discount_amount") @rules(apply: ["nullable", "numeric", "min:0", "App\\Rules\\MaintenanceDiscountWithinSubtotal"])
        discountPercent: Float @rename(attribute: "discount_percent") @rules(apply: ["nullable", "numeric", "min:0", "max:100"])
        subtotal: Float @rules(apply: ["nullable", "numeric", "min:0"])
        total: Float @rules(apply: ["nullable", "numeric", "min:0"])
        status: String
    ): MaintenanceRecord! @update @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "edit")

    "Permanently delete a maintenance record. Cascades to its line items."
    deleteMaintenanceRecord(id: ID! @eq @authorizeParent(model: "App\\Models\\MaintenanceRecord")): MaintenanceRecord! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "delete")
}

"One line item on a maintenance record's bill. Only read through MaintenanceRecord.items — no standalone query, same reasoning as AlertRuleRecipient/RouteRunPoint."
type MaintenanceItem {
    id: ID!
    maintenanceRecordId: ID! @rename(attribute: "maintenance_record_id")
    itemName: String! @rename(attribute: "item_name")
    quantity: Float!
    unitPrice: Float @rename(attribute: "unit_price")
    grossPrice: Float @rename(attribute: "gross_price")
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Mutation {
    createMaintenanceItem(
        maintenanceRecordId: ID! @rename(attribute: "maintenance_record_id") @authorizeParent(model: "App\\Models\\MaintenanceRecord")
        itemName: String! @rename(attribute: "item_name")
        quantity: Float @rules(apply: ["nullable", "numeric", "gt:0"])
        unitPrice: Float @rename(attribute: "unit_price") @rules(apply: ["nullable", "numeric", "min:0"])
        grossPrice: Float @rename(attribute: "gross_price") @rules(apply: ["nullable", "numeric", "min:0"])
    ): MaintenanceItem! @create @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "add")

    updateMaintenanceItem(
        id: ID!
        itemName: String @rename(attribute: "item_name")
        quantity: Float @rules(apply: ["nullable", "numeric", "gt:0"])
        unitPrice: Float @rename(attribute: "unit_price") @rules(apply: ["nullable", "numeric", "min:0"])
        grossPrice: Float @rename(attribute: "gross_price") @rules(apply: ["nullable", "numeric", "min:0"])
    ): MaintenanceItem! @update @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "edit")

    "Permanently delete a maintenance line item."
    deleteMaintenanceItem(id: ID! @eq @authorizeParent(model: "App\\Models\\MaintenanceItem")): MaintenanceItem! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "maintenance", action: "delete")
}

# ---------------------------------------------------------------------------
# Billing domain: Plan (catalogue) -> CompanySubscription (a company's subscription to
# a plan) -> Invoice (a bill, optionally tied to a subscription). None of these tables
# has a deleted_at column — every delete below is permanent. Unlike the "detail row"
# tables in other domains (AlertRuleRecipient, RouteRunPoint, MaintenanceItem), an
# Invoice is independently meaningful (e.g. "look up this invoice by number for
# support"), so it gets its own standalone paginated query, not just a relation field.
# ---------------------------------------------------------------------------

"A subscription plan companies can be on. features is an opaque JSON-encoded string, same convention as elsewhere in this schema."
type Plan {
    id: ID!
    name: String!
    monthlyPrice: Float @rename(attribute: "monthly_price")
    deviceLimit: Int @rename(attribute: "device_limit")
    "Opaque JSON-encoded string — this API does not parse or validate it."
    features: String
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    plans: [Plan!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"])
    plan(id: ID! @eq): Plan @find @guard(with: ["sanctum"])
}

extend type Mutation {
    createPlan(
        name: String!
        monthlyPrice: Float @rename(attribute: "monthly_price")
        deviceLimit: Int @rename(attribute: "device_limit")
        features: String
    ): Plan! @create @guard(with: ["sanctum"])

    updatePlan(
        id: ID!
        name: String
        monthlyPrice: Float @rename(attribute: "monthly_price")
        deviceLimit: Int @rename(attribute: "device_limit")
        features: String
    ): Plan! @update @guard(with: ["sanctum"])

    "Permanently delete a plan. Will fail if any company_subscriptions still reference it (restrict-on-delete FK)."
    deletePlan(id: ID! @eq): Plan! @delete @guard(with: ["sanctum"])
}

"A company's subscription to a plan."
type CompanySubscription {
    id: ID!
    companyId: ID! @rename(attribute: "company_id")
    planId: ID! @rename(attribute: "plan_id")
    "Plain date string (YYYY-MM-DD) — no date scalar in this schema."
    startsAt: String! @rename(attribute: "starts_at")
    renewsAt: String @rename(attribute: "renews_at")
    "active | past_due | cancelled"
    status: String!
    "Invoices billed against this subscription."
    invoices: [Invoice!]! @hasMany @requiresPermission(module: "billing", action: "view")
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    companySubscriptions: [CompanySubscription!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "billing", action: "view")
