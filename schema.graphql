type Query {
    "Simple reachability check — returns the app name if the GraphQL endpoint is up."
    ping: String! @field(resolver: "App\\GraphQL\\Queries\\Ping")
}

# ---------------------------------------------------------------------------
# File uploads (added 2026-10-28): a cross-cutting utility used by both Vehicle
# (photoPath) and Document (filePath) — not tied to one domain, hence its own small
# section rather than living inside either of those. Uses the standard GraphQL
# multipart request spec via Lighthouse's built-in `Upload` scalar — the request still
# goes to the same /graphql endpoint, just as multipart/form-data instead of plain
# JSON, so this is not a REST route and doesn't need one.
# ---------------------------------------------------------------------------

scalar Upload @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Upload")

extend type Mutation {
    """
    Upload a file and get back its public URL to paste into photoPath/logoPath/filePath
    on the relevant create/update mutation. `purpose` is one of "vehicle_photo",
    "user_photo", "driver_photo", "company_logo" (all: jpg/jpeg/png/webp, max 5 MB), or
    "document" (pdf, max 10 MB) — picks both the validation rule and the storage folder.
    Rejects a file whose actual content doesn't match its extension, not just a
    mismatched filename.
    """
    uploadFile(file: Upload!, purpose: String!): String! @field(resolver: "App\\GraphQL\\Mutations\\UploadFile") @guard(with: ["sanctum"])
}

"One raw device transmission to be decoded and stored, same shape as the device log format."
input PositionEntryInput {
    "Device IMEI, as a string."
    imei: String!

    "Hex-encoded raw device bytes (Teltonika Codec 8 Extended currently supported)."
    rawPayload: String!

    "When the ingestion layer received this packet (not the GPS fix time — that's decoded from inside the payload)."
    timestamp: String

    "Source IP of the device connection, for traceability."
    sourceIp: String
}

"Outcome of attempting to decode and store a single PositionEntryInput."
type IngestResult {
    imei: String!

    "decoded | unrecognized | failed — see docs/API_INGEST_REFERENCE.md for meanings."
    status: String!

    "Present only when status is not 'decoded'."
    error: String

    "The device_raw_logs row this entry was stored as — every entry is kept, decoded or not."
    rawLogId: ID!
}

type Mutation {
    "Submit a batch of raw device transmissions for decoding and storage."
    ingestPositions(entries: [PositionEntryInput!]!): [IngestResult!]! @guard(with: ["sanctum"])
        @guard(with: ["sanctum"])
}

# =============================================================================
# Auth: login, forgotPassword, resetPassword. Unlike every other mutation in this
# schema, these three are deliberately PUBLIC — no @guard, no bearer token required —
# since the whole point is the caller doesn't have a token yet. This is the one
# place in the project where that's correct, not an oversight.
#
# `register` (new company self-signup) is explicitly deferred to a future task — not
# built here.
#
# Known placeholders, safe but not yet production-real (see CHANGELOG):
# - Password-reset emails are sent via Laravel's "log" mail driver (MAIL_MAILER in
#   .env) — nothing fails, but no real email goes out until real SMTP credentials
#   are configured.
# - The reset link points at a placeholder frontend URL
#   (FRONTEND_RESET_PASSWORD_URL in .env / config/app.php) until the real Next.js
#   frontend exists.
# =============================================================================

"Returned by a successful login — a bearer token plus who just logged in."
type AuthPayload {
    "Use as: Authorization: Bearer <token>. Never expires, same as every other token in this project."
    token: String!
    user: User!
}

extend type Mutation {
    "Log in with email + password. Public — see the note above this block."
    login(email: String!, password: String!): AuthPayload!

    """
    Request a password-reset email. Public. Always returns true whether or not the
    email matches a real account, so this can't be used to discover which emails are
    registered. `locale` controls both the email's language and the emailed link's
    `/{locale}/reset-password` path — anything other than "en"/"ar" silently falls
    back to "en" rather than erroring. Added 2026-11-03, frontend gap B8.
    """
    forgotPassword(email: String!, locale: String = "en"): Boolean!

    "Redeem a password-reset token (from the emailed link) to set a new password. Public. Tokens expire after 60 minutes (Laravel's default)."
    resetPassword(token: String!, email: String!, password: String!): Boolean!

    """
    Sign in with a Google ID token (added 2026-10-30). Public, like `login` — no
    self sign-up: only an *existing* user matched by email can sign in this way.
    Returns the error "This Google account is not registered." (extensions.reason:
    "not_registered") for an unknown email, or "Invalid Google token." for a bad,
    expired, foreign (wrong aud), or unverified-email token. An inactive/suspended
    existing user gets the same status error `login` gives them.
    """
    loginWithGoogle(idToken: String!): AuthPayload! @field(resolver: "App\\GraphQL\\Mutations\\LoginWithGoogle")
}

"""
The caller's own identity, resolved from their bearer token — added 2026-10-29 so the
frontend can tell a platform account from a company user without guessing from how many
companies the `companies` query returns. companyId and company are null for a platform
account (company_id is null on the users row); both are populated for a normal company
user.
"""
type Me {
    id: ID!
    name: String!
    email: String!
    companyId: ID
    company: Company
    "This schema supports one role per user today, so this is always a single-element array."
    roles: [String!]!
    """
    "{moduleCode}.{action}" strings, e.g. "vehicles.edit" — action is one of
    view/add/edit/delete, moduleCode matches `modules.code` (see ModuleSeeder). A
    platform account gets every module/action combination, since @requiresPermission
    already bypasses them entirely. For a company user, a module with no configured
    role_permissions row is fail-open (see RequiresPermissionDirective), so every
    action on it is included here too — this list reflects what's actually allowed
    right now, not just what's been explicitly granted.
    """
    permissions: [String!]!
}

extend type Query {
    "Who the current bearer token belongs to."
    me: Me! @field(resolver: "App\\GraphQL\\Queries\\Me") @guard(with: ["sanctum"])
}

extend type Mutation {
    """
    Change the authenticated caller's own password, given their current one — requires a
    valid bearer token, unlike forgotPassword/resetPassword above (the "I forgot it, email
    me a link" flow for someone who can't log in at all). Added 2026-10-29.
    """
    changePassword(oldPassword: String!, newPassword: String!): Boolean! @field(resolver: "App\\GraphQL\\Mutations\\ChangePassword") @guard(with: ["sanctum"])

    """
    Revokes the Sanctum token used to authenticate this request. Added 2026-11-03
    (frontend gap B4) — previously sign-out only cleared the frontend's cookie and the
    token kept working forever; tokens now also carry a 30-day rolling expiration
    regardless of logout (see config/sanctum.php).
    """
    logout: Boolean! @field(resolver: "App\\GraphQL\\Mutations\\Logout") @guard(with: ["sanctum"])
}

"""
A driver employed by a company. May optionally be linked to a user account
(drivers.user_id) if they've been granted app login access — most drivers won't have
one. This is separate from username/password below, which is the driver's own
driver-app login identity (added 2026-10-29, Account Management gap analysis) —
independent of whether they also have a full portal User account. password is
write-only — hashed automatically on write by the model's own cast, never returned by
any query, same convention as User.password. nationality and bloodGroup are personal
data under UAE PDPL; this type is guarded behind authentication for that reason, same
as every other field here.
"""
type Driver {
    id: ID!
    companyId: ID! @rename(attribute: "company_id")
    userId: ID @rename(attribute: "user_id")
    "This driver's own driver-app login name. Null if they haven't been given app access."
    username: String
    name: String!
    mobile: String!
    address: String
    photoPath: String @rename(attribute: "photo_path")
    nationality: String
    bloodGroup: String @rename(attribute: "blood_group")
    emergencyContactName: String @rename(attribute: "emergency_contact_name")
    emergencyContactNumber: String @rename(attribute: "emergency_contact_number")
    notes: String
    employeeId: String @rename(attribute: "employee_id")
    "active | inactive — distinct from employmentType (Permanent/Temporary)."
    employmentStatus: String! @rename(attribute: "employment_status")
    "permanent | temporary"
    employmentType: String @rename(attribute: "employment_type")
    workingHoursPerDay: Float @rename(attribute: "working_hours_per_day")
    overtimeRate: Float @rename(attribute: "overtime_rate")
    licenceNo: String @rename(attribute: "licence_no")
    licenceExpiryDate: String @rename(attribute: "licence_expiry_date")
    visaExpiryDate: String @rename(attribute: "visa_expiry_date")
    otherPermitName: String @rename(attribute: "other_permit_name")
    otherPermitNo: String @rename(attribute: "other_permit_no")
    permitExpiresAt: String @rename(attribute: "permit_expires_at")
    "Uploaded via uploadFile(purpose: \"document\")."
    permitPdfPath: String @rename(attribute: "permit_pdf_path")
    rfidTagId: String @rename(attribute: "rfid_tag_id")
    preferredVehicleType: String @rename(attribute: "preferred_vehicle_type")
    canDriveHeavy: Boolean! @rename(attribute: "can_drive_heavy")
    canDriveLight: Boolean! @rename(attribute: "can_drive_light")
    status: String!
    "Users granted visibility into this driver ('Assign Driver To User' on the reference site)."
    userAccess: [UserDriver!]! @hasMany
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

