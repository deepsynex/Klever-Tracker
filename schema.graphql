"A latitude/longitude pair used to set a geofence's centre point or polygon vertices."
input GeoPointInput {
    lat: Float!
    lng: Float!
}

"""
A geofence: a named area (circle, polygon, or route) a company draws to trigger alerts
when a vehicle enters or exits it. `area` and `centre` are stored as native PostGIS
geography columns — Eloquent has no built-in geography type, so they're exposed here as
plain lat/lng/GeoJSON instead of raw columns. Unlike Driver, this table has no
deleted_at column — deleteGeofence is a real delete, not a soft one; is_active is the
intended way to deactivate a geofence without removing it.
"""
type Geofence {
    id: ID!
    companyId: ID! @rename(attribute: "company_id")
    name: String!
    address: String!
    "circle | polygon | route"
    type: String!
    radiusM: Float @rename(attribute: "radius_m")
    isActive: Boolean! @rename(attribute: "is_active")
    createdBy: ID @rename(attribute: "created_by")
    "Centre point latitude (circle/route geofences). Null if no centre has been set."
    centreLat: Float @method(name: "centreLat")
    "Centre point longitude (circle/route geofences). Null if no centre has been set."
    centreLng: Float @method(name: "centreLng")
    "The geofence boundary (polygon type) as GeoJSON. Null if no area has been set."
    areaGeoJson: String @method(name: "areaGeoJson")
    "Vehicles individually assigned to this geofence."
    vehicles: [Vehicle!]! @belongsToMany @requiresPermission(module: "vehicles", action: "view")
    "Vehicle groups assigned to this geofence (every vehicle in the group is watched)."
    vehicleGroups: [VehicleGroup!]! @belongsToMany @requiresPermission(module: "vehicle-groups", action: "view")
    "Raw single-vehicle assignment rows — use these ids with deleteGeofenceVehicle."
    vehicleMemberships: [GeofenceVehicle!]! @hasMany
    "Raw vehicle-group assignment rows — use these ids with deleteGeofenceVehicleGroup."
    vehicleGroupMemberships: [GeofenceVehicleGroup!]! @hasMany
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    "Paginated list of geofences."
    geofences: [Geofence!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "geofences", action: "view")

    "A single geofence by ID."
    geofence(id: ID! @eq): Geofence @find @guard(with: ["sanctum"]) @requiresPermission(module: "geofences", action: "view")
}

extend type Mutation {
    """
    Create a new geofence. Resolved by App\\GraphQL\\Mutations\\CreateGeofence (not the
    generic @create directive — it can't write geography columns). Pass `centre` for a
    circle/route geofence, or `area` (3+ points — the ring is auto-closed if needed) for
    a polygon.
    """
    createGeofence(
        companyId: ID! @forceOwnCompany
        name: String!
        address: String!
        type: String!
        radiusM: Float
        isActive: Boolean
        createdBy: ID
        centre: GeoPointInput
        area: [GeoPointInput!]
    ): Geofence! @guard(with: ["sanctum"]) @requiresPermission(module: "geofences", action: "add")

    """
    Update an existing geofence (resolved by App\\GraphQL\\Mutations\\UpdateGeofence, for
    the same reason as createGeofence). Only pass the fields that should change; passing
    `centre` or `area` replaces that geometry entirely.
    """
    updateGeofence(
        id: ID!
        name: String
        address: String
        type: String
        radiusM: Float
        isActive: Boolean
        createdBy: ID
        centre: GeoPointInput
        area: [GeoPointInput!]
    ): Geofence! @guard(with: ["sanctum"]) @requiresPermission(module: "geofences", action: "edit")

    "Permanently delete a geofence — no soft-delete column exists for this table. Cascades to its vehicle/vehicle-group assignments."
    deleteGeofence(id: ID! @eq @authorizeParent(model: "App\\Models\\Geofence")): Geofence! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "geofences", action: "delete")
}

# ---------------------------------------------------------------------------
# Alerts domain: EventType (catalogue) -> AlertRule (config) -> AlertRuleRecipient
# (who gets notified) -> AlertEvent (an occurrence). None of these tables has a
# deleted_at column — every delete below is permanent. No automatic rule-evaluation
# engine exists yet (see AlertEvent model docblock) — alertEvents only has rows if
# something creates them through this API.
# ---------------------------------------------------------------------------

"The catalogue of things an alert rule can fire on (speeding, harsh braking, geofence enter/exit, idle, etc.)."
type EventType {
    id: ID!
    name: String!
    code: String!
    status: String!
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    eventTypes: [EventType!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"])
    eventType(id: ID! @eq): EventType @find @guard(with: ["sanctum"])
}

extend type Mutation {
    createEventType(name: String!, code: String!, status: String): EventType! @create @guard(with: ["sanctum"])
    updateEventType(id: ID!, name: String, code: String, status: String): EventType! @update @guard(with: ["sanctum"])
    "Permanently delete an event type. Will fail if any alert_rules still reference it (restrict-on-delete FK)."
    deleteEventType(id: ID! @eq): EventType! @delete @guard(with: ["sanctum"])
}

"""
A configurable "when X happens, notify Y via Z" rule. `schedule` and `parameters` are
raw jsonb columns passed through as opaque JSON-encoded strings (this schema has no
JSON scalar type) — the API stores/returns them as-is without parsing. vehicleGroupId
has no backing type yet (VehicleGroup isn't modelled) — plain ID, no relation.
"""
type AlertRule {
    id: ID!
    companyId: ID! @rename(attribute: "company_id")
    eventTypeId: ID! @rename(attribute: "event_type_id")
    name: String!
    description: String
    isActive: Boolean! @rename(attribute: "is_active")
    isSystemRule: Boolean! @rename(attribute: "is_system_rule")
    isScheduled: Boolean! @rename(attribute: "is_scheduled")
    "Opaque JSON-encoded string — this API does not parse or validate it."
    schedule: String
    "Opaque JSON-encoded string — this API does not parse or validate it."
    parameters: String
    vehicleId: ID @rename(attribute: "vehicle_id")
    vehicleGroupId: ID @rename(attribute: "vehicle_group_id")
    notifyInApp: Boolean! @rename(attribute: "notify_in_app")
    notifyPush: Boolean! @rename(attribute: "notify_push")
    notifyEmail: Boolean! @rename(attribute: "notify_email")
    notifySms: Boolean! @rename(attribute: "notify_sms")
    notifyWhatsapp: Boolean! @rename(attribute: "notify_whatsapp")
    emailSubject: String @rename(attribute: "email_subject")
    emailMessage: String @rename(attribute: "email_message")
    smsMessage: String @rename(attribute: "sms_message")
    minRepeatIntervalMinutes: Int @rename(attribute: "min_repeat_interval_minutes")
    resetIntervalOnAck: Boolean! @rename(attribute: "reset_interval_on_ack")
    createdBy: ID @rename(attribute: "created_by")
    "Who gets notified when this rule fires."
    recipients: [AlertRuleRecipient!]! @hasMany
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    alertRules: [AlertRule!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "alerts", action: "view")
    alertRule(id: ID! @eq): AlertRule @find @guard(with: ["sanctum"]) @requiresPermission(module: "alerts", action: "view")
