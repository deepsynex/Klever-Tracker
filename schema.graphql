        name: String!
        username: String! @rules(apply: ["App\\Rules\\UniqueUserUsername"])
        email: String! @rules(apply: ["App\\Rules\\UniqueUserEmail"])
        "Plain text — hashed automatically on write by the model's own cast. Never returned by any query."
        password: String!
        mobile: String
        address: String
        photoPath: String @rename(attribute: "photo_path")
        status: String
        isAdmin: Boolean @rename(attribute: "is_admin")
        isSuperAdmin: Boolean @rename(attribute: "is_super_admin")
        defaultLandingPage: String @rename(attribute: "default_landing_page")
        muteAlerts: Boolean @rename(attribute: "mute_alerts")
        notificationPreferences: String @rename(attribute: "notification_preferences")
    ): User! @create @guard(with: ["sanctum"]) @requiresPermission(module: "core", action: "add")

    "Update an existing user. Only pass the fields that should change; pass password only to reset it."
    updateUser(
        id: ID!
        companyId: ID @rename(attribute: "company_id") @forceOwnCompany
        roleId: ID @rename(attribute: "role_id") @rules(apply: ["App\\Rules\\CannotChangeOwnRole"])
        departmentId: ID @rename(attribute: "department_id")
        name: String
        username: String @rules(apply: ["App\\Rules\\UniqueUserUsername"])
        email: String @rules(apply: ["App\\Rules\\UniqueUserEmail"])
        password: String
        mobile: String
        address: String
        photoPath: String @rename(attribute: "photo_path")
        status: String @rules(apply: ["App\\Rules\\CannotDeactivateSelf"])
        isAdmin: Boolean @rename(attribute: "is_admin") @rules(apply: ["App\\Rules\\CannotRemoveOwnAdminFlag"])
        isSuperAdmin: Boolean @rename(attribute: "is_super_admin")
        defaultLandingPage: String @rename(attribute: "default_landing_page")
        muteAlerts: Boolean @rename(attribute: "mute_alerts")
        notificationPreferences: String @rename(attribute: "notification_preferences")
    ): User! @update @guard(with: ["sanctum"]) @requiresPermission(module: "core", action: "edit")

    "Soft-delete a user (sets deleted_at — row is kept, not removed), same as deleteDriver/deleteVehicle/deleteCompany."
    deleteUser(id: ID! @eq @authorizeParent(model: "App\\Models\\User")): User! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "core", action: "delete")
}

"A GPS tracking device (hardware unit), independent of whichever vehicle it's currently installed in (if any)."
type Device {
    id: ID!
    companyId: ID @rename(attribute: "company_id")
    vehicleId: ID @rename(attribute: "vehicle_id")
    imei: String!
    model: String
    protocol: String
    shipmentBatch: String @rename(attribute: "shipment_batch")
    warrantyExpiresAt: String @rename(attribute: "warranty_expires_at")
    "in_stock | installed | faulty | retired"
    status: String!
    lastSeenAt: String @rename(attribute: "last_seen_at")
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    devices: [Device!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "core", action: "view")
    device(id: ID! @eq): Device @find @guard(with: ["sanctum"]) @requiresPermission(module: "core", action: "view")
}

extend type Mutation {
    createDevice(
        companyId: ID @rename(attribute: "company_id") @forceOwnCompany
        vehicleId: ID @rename(attribute: "vehicle_id")
        imei: String!
        model: String
        protocol: String
        shipmentBatch: String @rename(attribute: "shipment_batch")
        warrantyExpiresAt: String @rename(attribute: "warranty_expires_at")
        status: String
    ): Device! @create @guard(with: ["sanctum"]) @requiresPermission(module: "core", action: "add")

    updateDevice(
        id: ID!
        companyId: ID @rename(attribute: "company_id") @forceOwnCompany
        vehicleId: ID @rename(attribute: "vehicle_id")
        model: String
        protocol: String
        shipmentBatch: String @rename(attribute: "shipment_batch")
        warrantyExpiresAt: String @rename(attribute: "warranty_expires_at")
        status: String
        lastSeenAt: String @rename(attribute: "last_seen_at")
    ): Device! @update @guard(with: ["sanctum"]) @requiresPermission(module: "core", action: "edit")

    "Permanently delete a device. No soft-delete column exists for this table."
    deleteDevice(id: ID! @eq @authorizeParent(model: "App\\Models\\Device")): Device! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "core", action: "delete")
}

# =============================================================================
# Live position + raw ingestion log: READ ONLY. Both tables are already written to
# internally by PositionIngestionService on every inbound device transmission — there
# are deliberately no create/update/delete mutations here, since writing to them
# through the API directly would bypass the decode pipeline entirely and could corrupt
# the live-map state. This is the read side that was missing: until now, device data
# could be ingested but never read back out through the API at all.
# =============================================================================

"""
One device's most recent known position — the live-map table. Always holds exactly one
row per device, overwritten on every new fix (never a history). For a device's full
position history, see `positions` (not yet exposed in GraphQL — see CHANGELOG).
location is a raw PostGIS geography Point column, exposed as locationLat/locationLng.
attributes is the decoded Teltonika IO data (ignition, GSM signal, etc.) as an opaque
JSON-encoded string — same convention as other jsonb fields in this schema.

Note: this type's identifying field is deviceId, not id — device_last_positions has no
separate `id` column; device_id is itself the primary key (one row per device).
"""
type DeviceLastPosition {
    deviceId: ID! @rename(attribute: "device_id")
    vehicleId: ID! @rename(attribute: "vehicle_id")
    recordedAt: String! @rename(attribute: "recorded_at")
    speed: Float
    heading: Int
    ignition: Boolean
    "Latitude of this device's last known position."
    locationLat: Float @method(name: "locationLat")
    "Longitude of this device's last known position."
    locationLng: Float @method(name: "locationLng")
    "Opaque JSON-encoded string — this API does not parse or validate it."
    attributes: String @method(name: "attributesJson")
    """
    "moving" | "idle" | "stopped" | "offline" — computed from recordedAt's age against
    this vehicle's company's offlineAlertMinutes (or a 30-minute default), ignition, and
    speed, so every screen agrees on the same definition. Added 2026-11-02.
    """
    status: String! @method(name: "status")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    "The current/last-known position of every tracked device — the live fleet map."
    deviceLastPositions: [DeviceLastPosition!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "live-position", action: "view")

    "The current/last-known position of a single device, by its device id."
    deviceLastPosition(deviceId: ID! @eq(key: "device_id")): DeviceLastPosition @find @guard(with: ["sanctum"]) @requiresPermission(module: "live-position", action: "view")

    """
    The current/last-known position for a specific set of vehicles — added 2026-11-02
    for polling screens like Multi Tracking, where only the handful of currently-tiled
    vehicles need refreshing each cycle rather than the whole fleet. Not paginated;
    capped at 50 ids per call. A vehicle id outside the caller's company or vehicle
    assignment is silently absent from the result, not an error.
    """
    deviceLastPositionsForVehicles(vehicleIds: [ID!]! @rulesForArray(apply: ["max:50"])): [DeviceLastPosition!]!
        @field(resolver: "App\\GraphQL\\Queries\\DeviceLastPositionsForVehicles")
        @guard(with: ["sanctum"])
        @requiresPermission(module: "live-position", action: "view")
}

"""
Durable capture of every inbound device transmission, decoded or not — nothing is ever
lost here even if a device/protocol isn't recognized. Primarily a debugging/audit tool
(e.g. "why isn't this device showing up," "what's failing to decode"), not something a
normal fleet-tracking UI would show an end user. Supports filtering by imei and/or
status directly on the list query, since those are the two realistic ways someone
actually wants to search this table.
"""
type DeviceRawLog {
    id: ID!
    imei: String!
    deviceId: ID @rename(attribute: "device_id")
    sourceIp: String @rename(attribute: "source_ip")
    deviceReportedAt: String @rename(attribute: "device_reported_at")
    rawPayload: String! @rename(attribute: "raw_payload")
    "pending | decoded | failed | unrecognized"
    status: String!
    protocol: String
    "The device this entry decoded into — set only once status is \"decoded\". No FK constraint, see the model's docblock (positions' composite PK)."
    decodedDeviceId: ID @rename(attribute: "decoded_device_id")
    decodedRecordedAt: String @rename(attribute: "decoded_recorded_at")
    errorMessage: String @rename(attribute: "error_message")
    decodedAt: String @rename(attribute: "decoded_at")
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    "Paginated device ingestion history. Pass imei and/or status to filter (e.g. status: \"failed\" to find everything that didn't decode)."
    deviceRawLogs(imei: String @eq, status: String @eq): [DeviceRawLog!]! @requiresPermission(module: "live-position", action: "view")
        @paginate(defaultCount: 25) @guard(with: ["sanctum"])

    deviceRawLog(id: ID! @eq): DeviceRawLog @find @guard(with: ["sanctum"]) @requiresPermission(module: "live-position", action: "view")
}

# =============================================================================
# Department: a simple internal grouping within a company (e.g. "Sales",
# "Logistics"). Part of the original 57-table schema design
# (docs/GPS_Fleet_Tracking_Database_Schema.md) from the start — User.departmentId
# already referenced it — it just never got its own GraphQL type until now.
# No soft delete — this table has no deleted_at column.
# =============================================================================

"A department within a company (e.g. \"Sales\", \"Logistics\")."
type Department {
    id: ID!
    companyId: ID! @rename(attribute: "company_id")
    name: String!
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")
}

extend type Query {
    departments: [Department!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "department", action: "view")
    department(id: ID! @eq): Department @find @guard(with: ["sanctum"]) @requiresPermission(module: "department", action: "view")
}

extend type Mutation {
    createDepartment(companyId: ID! @rename(attribute: "company_id") @forceOwnCompany, name: String!): Department! @requiresPermission(module: "department", action: "add")
        @create @guard(with: ["sanctum"])

    updateDepartment(id: ID!, name: String): Department! @update @guard(with: ["sanctum"]) @requiresPermission(module: "department", action: "edit")

    "Permanently delete a department. Users in it have their departmentId set null (nullOnDelete), not cascaded."
    deleteDepartment(id: ID! @eq @authorizeParent(model: "App\\Models\\Department")): Department! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "department", action: "delete")
}

# =============================================================================
# Position history: READ ONLY, and the last remaining table without any GraphQL
# access. `positions` is the full GPS fix history (every position ever recorded),
# as opposed to DeviceLastPosition's single latest fix per device — the "everywhere
# it's been" complement to DeviceLastPosition's "where is it right now."
#
# This table has no `id` column and a composite primary key (device_id, recorded_at)
# by design (intended for an eventual TimescaleDB hypertable), so it can't use the
# standard @paginate-on-a-model / @find pattern every other type in this schema uses.
# Instead, Query.positionHistory uses @paginate's `builder` argument, pointing at a
# hand-written resolver (App\GraphQL\Queries\PositionHistoryQuery) that builds the
# filtered, ordered query itself — including the computed lat/lng columns, selected
# directly in the same query instead of a separate lookup per row, since a history
# query can realistically return thousands of rows.
# =============================================================================

"""
One historical GPS fix. locationLat/locationLng follow the same pattern as every other
PostGIS point in this schema, but are computed directly in the query behind this field
(see PositionHistoryQuery) rather than via a per-row lookup, for performance on a
table that can hold a very large number of rows. attributes is the decoded Teltonika
IO data as an opaque JSON-encoded string, same convention as elsewhere.
"""
type PositionHistoryEntry {
    deviceId: ID! @rename(attribute: "device_id")
    recordedAt: String! @rename(attribute: "recorded_at")
    speed: Float
    heading: Int
    ignition: Boolean
    "Latitude of this fix."
    locationLat: Float @rename(attribute: "lat")
    "Longitude of this fix."
    locationLng: Float @rename(attribute: "lng")
    "Opaque JSON-encoded string — this API does not parse or validate it."
    attributes: String
}

extend type Query {
    """
    A device's (or vehicle's) full GPS position history, newest first, optionally
    narrowed to a time range. At least one of deviceId or vehicleId is required — an
    unfiltered query over the entire history table is not supported, since it could
    be an unbounded number of rows. Pass from/to to narrow by recordedAt
    (e.g. "this vehicle, between 2pm and 4pm yesterday").
    """
    positionHistory(deviceId: ID, vehicleId: ID, from: String, to: String): [PositionHistoryEntry!]! @requiresPermission(module: "live-position", action: "view")
        @paginate(builder: "App\\GraphQL\\Queries\\PositionHistoryQuery@builder", defaultCount: 50)
        @guard(with: ["sanctum"])
}
