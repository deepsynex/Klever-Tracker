"A public, token-based share link for a vehicle's live position (e.g. a \"track my delivery\" link)."
type SharedLiveLocation {
    id: ID!
    vehicleId: ID! @rename(attribute: "vehicle_id")
    shareToken: String! @rename(attribute: "share_token")
    createdBy: ID @rename(attribute: "created_by")
    startsAt: String @rename(attribute: "starts_at")
    expiresAt: String! @rename(attribute: "expires_at")
    createdAt: String! @rename(attribute: "created_at")
    updatedAt: String! @rename(attribute: "updated_at")

    """
    Flattened position fields for the public tracking page (added 2026-10-28) — these
    are what `sharedLiveLocationByToken` is for: everything a map needs, with no login
    and no other query to follow. Each is null if the vehicle has no device, or its
    device has no fix yet, rather than an error.
    """
    plateNo: String @method(name: "plateNo")
    latitude: Float @method(name: "latitude")
    longitude: Float @method(name: "longitude")
    speed: Float @method(name: "speed")
    heading: Int @method(name: "heading")
    positionRecordedAt: String @method(name: "positionRecordedAt")
}

extend type Query {
    sharedLiveLocations: [SharedLiveLocation!]! @paginate(defaultCount: 25) @guard(with: ["sanctum"]) @requiresPermission(module: "sharing", action: "view")
    sharedLiveLocation(id: ID! @eq): SharedLiveLocation @find @guard(with: ["sanctum"]) @requiresPermission(module: "sharing", action: "view")
    """
    Public lookup of a share link by its token alone — no bearer token required (same
    tier as `ping`/`login`/`forgotPassword`). This is what an anonymous customer's
    tracking page calls. Resolves to null if the token doesn't exist, or exists but is
    outside its startsAt/expiresAt window — deliberately indistinguishable from a
    wrong token, same "not found" principle used everywhere else in this schema.
    """
    sharedLiveLocationByToken(shareToken: String!): SharedLiveLocation @field(resolver: "App\\GraphQL\\Queries\\SharedLiveLocationByTokenQuery")
}

extend type Mutation {
    createSharedLiveLocation(
        vehicleId: ID! @rename(attribute: "vehicle_id") @authorizeParent(model: "App\\Models\\Vehicle")
        shareToken: String! @rename(attribute: "share_token")
        createdBy: ID @rename(attribute: "created_by")
        startsAt: String @rename(attribute: "starts_at")
        expiresAt: String! @rename(attribute: "expires_at")
    ): SharedLiveLocation! @create @guard(with: ["sanctum"]) @requiresPermission(module: "sharing", action: "add")

    updateSharedLiveLocation(id: ID!, expiresAt: String @rename(attribute: "expires_at")): SharedLiveLocation! @requiresPermission(module: "sharing", action: "edit")
        @update @guard(with: ["sanctum"])

    "Permanently delete (revoke) a share link."
    deleteSharedLiveLocation(id: ID! @eq @authorizeParent(model: "App\\Models\\SharedLiveLocation")): SharedLiveLocation! @delete @guard(with: ["sanctum"]) @requiresPermission(module: "sharing", action: "delete")
}

